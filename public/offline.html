<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Coltasi Fit</title>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    background: #F6F4EF;
    color: #12110F;
  }
  @media (prefers-color-scheme: dark) {
    html, body { background: #121116; color: #F5F3EF; }
    .card { background: #201F26 !important; border-color: #2C2B33 !important; }
    .muted { color: #8B8892 !important; }
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 360px;
    width: 100%;
    text-align: center;
    background: #FFFFFF;
    border: 1px solid #F0EEE9;
    border-radius: 20px;
    padding: 36px 28px;
  }
  h1 {
    font-size: 20px;
    font-weight: 800;
    margin: 0 0 8px;
    color: #163360;
  }
  p {
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 20px;
  }
  .muted { color: #9A968D; }
  button {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: #2B7FAE;
    border: none;
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
  }
  button:active { background: #1D6491; }
</style>
</head>
<body>
  <div class="card">
    <h1>You&rsquo;re offline</h1>
    <p class="muted">Coltasi Fit needs a connection to load your workouts, nutrition, and progress. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
