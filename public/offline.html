<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Coltasi · offline</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #F8F5EC; color: #153261; font-family: Montserrat, system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
  .wrap { max-width: 340px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  p { font-size: 15px; line-height: 1.5; color: #5E656A; margin: 0; }
  button { margin-top: 8px; height: 52px; padding: 0 28px; border: 0; border-radius: 14px; background: #B0401D; color: #fff; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
  <div class="wrap">
    <img src="/brand/coltasi-bird.svg" alt="" width="88" height="88" />
    <h1>You're offline</h1>
    <p>Coltasi needs a connection to load your training. Your logged sets are safe; try again when you're back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
